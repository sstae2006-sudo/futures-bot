[project]
name = "futures-bot"
version = "0.7.0"
description = "Backtesting, optimization, paper-trading, and live-trading framework for a single Micro E-mini futures contract, with a web research dashboard"
requires-python = ">=3.11"
# fastapi/uvicorn/python-multipart/openpyxl are required for `python -m
# futures_bot.api` itself (app.py, routes/*, and trade_import's xlsx path),
# not optional extras -- a bare `pip install -e .` must be able to run the
# API with zero further installs.
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    # contracts.py resolves ZoneInfo("America/Chicago") at import time.
    # Windows has no system IANA database at all, and slim Linux images ship
    # without one too -- without this package, every import of the package
    # (and every session-boundary calculation) raises ZoneInfoNotFoundError.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]
websocket = ["websockets>=12.0"]
# Phase 9: ML research workstation (model training/prediction). Imported
# lazily inside research/ml/ -- never at api/app.py module level -- so the
# API still boots without this extra installed; training routes surface a
# clear error instead of crashing the process.
ml = ["scikit-learn>=1.4", "xgboost>=2.0", "torch>=2.2", "pandas>=2.0", "numpy>=1.26", "joblib>=1.3"]
# Team deployment (see TEAM_DEPLOYMENT.md): pooled TimescaleDB/Postgres
# access. Imported lazily inside db/ -- never at api/app.py module level
# -- so the API still boots SQLite-only (today's default) without this
# extra installed; anything needing it surfaces a clear error instead of
# crashing the process at import time. SQLAlchemy Core only, not the ORM
# -- see db/engine.py's module docstring for why.
db = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1", "alembic>=1.13"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "benchmark: not a correctness check -- times something and asserts it isn't quadratic; slower than the rest of the suite.",
]
