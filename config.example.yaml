# Futures bot settings. Copy to config.yaml and edit.
# All prices are in index points; all money is in US dollars.

contract: MES          # MES, MNQ, M2K, MYM
mode: paper            # backtest | paper | live

risk:
  contracts_per_trade: 1
  stop_loss_points: 10        # MES: 10 pts = $50
  take_profit_points: 20      # MES: 20 pts = $100
  daily_max_loss: 120         # kill switch, dollars
  max_trades_per_session: 3
  account_size: 2500          # used for the risk warnings at startup

  # --- optional session rules (all off unless set) ---
  # profit_target: 500                 # stop for the day once realized P&L reaches this (mirrors daily_max_loss)
  # max_consecutive_losses: 3           # halt after this many losses in a row
  # cooldown_minutes_after_loss: 15     # pause new entries this long after a loss (0 = disabled)

session:
  start_ct: "08:30"                  # no entries before this (Central Time)
  end_ct: "15:00"                    # no entries after this
  flatten_before_close_minutes: 15   # force flat before the 16:00 CT close
  trade_on_weekends: false

broker:
  name: paper                 # paper | tradovate | ibkr  (ibkr not implemented yet)
  slippage_ticks: 1           # adverse ticks applied to every market fill; paper only
  commission_per_side: 0.62   # dollars per contract per side
  starting_cash: 2500         # paper only -- a real broker reports its own cash

  # --- tradovate only ---
  # Required when name: tradovate. This is Tradovate's own symbol for the
  # SPECIFIC expiry being traded (e.g. "MESZ5"), not the generic 'contract'
  # setting above. Credentials (username, password, API keys, account id)
  # are never set here -- they're read from environment variables at
  # connect time. See brokers/tradovate.py's module docstring for the full
  # variable list and, more importantly, the safety checklist to run
  # through on a DEMO account before ever setting TRADOVATE_ENV=live.
  # tradovate_symbol: MESZ5

logging:
  level: INFO
  directory: logs
  log_every_decision: true    # also log holds and blocked signals

# Available: ema_crossover | opening_range_breakout | vwap_reversion | trend_pullback
# All are standard published setups or reference implementations, not proven
# edges. Backtest before assuming anything.
strategy_name: opening_range_breakout

strategy_params:
  # --- opening_range_breakout ---
  range_minutes: 30              # length of the opening range window
  session_start_ct: "08:30"      # when the range starts building (RTH open)
  max_entries_per_session: 1     # usually 1; the first break is the signal
  require_close_beyond: true     # ignore wick-only pokes through the level
  min_range_points: 2            # skip days too tight to read
  max_range_points: 40           # skip days that already made their move
  stop_at_range_opposite: false  # true = stop at the far side of the range

  # --- ema_crossover ---
  # fast_period: 9
  # slow_period: 21

  # --- vwap_reversion ---
  # std_devs: 2                  # how far price must stretch before fading it
  # min_bars: 20                 # bars into the session before trading
  # exit_at_vwap: true           # target is the return to VWAP
  # max_entries_per_session: 3

  # --- trend_pullback (5-minute MES bars) ---
  # A full multi-filter trend-following system: trade only with the EMA50/
  # EMA200 regime, wait for a pullback to EMA21 rather than entering on the
  # raw cross, confirm with RSI/ADX/volume, then manage the exit with an
  # ATR-scaled stop/target, a trailing stop, a breakeven ratchet, and four
  # independent exit triggers. See strategy/trend_pullback/ for the module
  # breakdown. Every threshold below is a constructor parameter -- nothing
  # is hardcoded in the strategy itself.
  #
  # ema_fast: 9
  # ema_mid: 21
  # ema_slow: 50
  # ema_trend: 200
  # atr_period: 14
  # rsi_period: 14
  # adx_period: 14
  # volume_sma_period: 20
  # slope_lookback_bars: 5        # bars back for the EMA50/EMA200 slope feature
  #
  # rsi_long_min: 55
  # rsi_short_max: 45
  # adx_min: 20                   # trend strength floor
  # volume_multiplier: 1.25       # volume must clear this x the 20-bar average
  # atr_min: 0.5                  # skip bars too quiet to trust
  # trading_sessions:             # [["HH:MM","HH:MM"], ...] in CT; omit for no window filter
  #   - ["08:30", "10:30"]
  #   - ["13:30", "15:00"]
  #
  # pullback_distance: 3          # points from EMA21 that counts as "pulled back"
  # max_arm_bars: 6               # an armed setup older than this goes stale
  #
  # atr_stop_mult: 1.5            # initial stop = entry -/+ ATR * this
  # atr_target_mult: 3.0          # initial target = entry +/- ATR * this
  # trailing_atr_mult: 2.0        # trailing stop trails price by ATR * this
  # breakeven_trigger_points: 8   # move stop to breakeven after this much profit
  # breakeven_buffer_points: 0.5  # breakeven stop sits this far past entry
  # max_bars_in_trade: 24         # force an exit after this many bars
  # vwap_loss_enabled: true       # exit if price falls back through session VWAP
  # ema_reversal_enabled: true    # exit if EMA9/EMA21 cross against the position

state_file: state/bot_state.json

# Phase 8B: opt-in autonomous mode. Off by default -- turning this on and
# restarting the API (with MASSIVE_API_KEY set) auto-starts data sync,
# multi-strategy paper trading, and nightly research with no manual steps.
# See docs/RESEARCH_SERVER.md.
research_server:
  enabled: false
  paper_strategies: []   # e.g. [ema_crossover, trend_pullback] -- strategies to auto-paper-trade concurrently
  resolution: 5min
  poll_seconds: 30
  data_sync_products: [MES]   # product codes to keep synced via the data scheduler
  nightly_job_hour_ct: 2       # 24h, Central Time
  weekly_report_weekday: 6     # Monday=0 .. Sunday=6 -- also runs a full strategy comparison

# Team deployment (see TEAM_DEPLOYMENT.md). Uncomment to change from the
# single-developer default -- the database connection string itself
# (FUTURES_BOT_DATABASE_URL) is NEVER set here; it holds credentials and
# is env-var only, same as MASSIVE_API_KEY/TRADOVATE_*.
# deployment:
#   environment: team          # development | team | production
#   pool_size: 5                # baseline pooled DB connections (TimescaleDB only)
#   max_overflow: 10             # extra connections allowed under burst load
#   pool_recycle_seconds: 1800    # recycle a pooled connection this often
